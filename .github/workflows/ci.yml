name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Synthetic demo smoke test
        run: npm run smoke:demo
      - name: Remove generated artifacts before public scan
        run: rm -rf dist node_modules .vitest coverage
      - name: Public release scan
        run: npm run check:public
