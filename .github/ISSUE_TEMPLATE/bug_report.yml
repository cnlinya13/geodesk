name: Bug report
description: 报告可复现的代码或运行问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请不要提交 API Key、密码、Cookie、客户数据、生产日志或安全漏洞细节。安全问题请先阅读 SECURITY.md。
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请给出最小、可重复的步骤。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本与环境
      placeholder: 例如 0.1.0，Node 24，macOS/Linux
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: 已运行的检查
      description: 例如 npm test、npm run smoke:demo；请删去敏感输出。
