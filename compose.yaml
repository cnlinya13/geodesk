services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: geodesk
      POSTGRES_USER: geodesk
      POSTGRES_PASSWORD: ${GEODESK_POSTGRES_PASSWORD:-geodesk-local-only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - geodesk-postgres-data:/var/lib/postgresql/data

volumes:
  geodesk-postgres-data:
